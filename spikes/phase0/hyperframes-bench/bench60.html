<!doctype html>
<html lang="zh-Hant" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      /* Bench scene (phase 0 spike): transparent 1080x1920, white card slides up to y=780 in 0-0.5 s. */
      @font-face {
        font-family: "BenchNotoSansTC";
        src: url("assets/NotoSansTC-Bold.ttf") format("truetype");
        font-weight: 700;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 100%; height: 100%; }
      #card {
        position: absolute; left: 90px; top: 1920px; width: 900px; height: 360px;
        border-radius: 32px; background: #ffffff; padding: 0 48px;
        display: flex; align-items: center; justify-content: center;
      }
      #title {
        font-family: "BenchNotoSansTC"; font-weight: 700; font-size: 64px; line-height: 1.3;
        color: #111111; text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="60" data-width="1080" data-height="1920">
      <div id="card" class="clip" data-start="0" data-duration="60" data-track-index="0">
        <div id="title">三個步驟，剪出不像 AI 的短影音</div>
      </div>
    </div>
    <script>
      const DURATION = 60, LOOP = 5;
      const tl = gsap.timeline({ paused: true });
      for (let t = 0; t < DURATION; t += LOOP) {
        tl.fromTo("#card", { top: 1920 }, { top: 780, duration: 0.5, ease: "power3.out", immediateRender: t === 0 }, t);
      }
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
