[project]
name = "kacha"
version = "0.2.0"
description = "Turns talking-head footage into captioned Instagram Reels."
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = "==3.12.*"
dependencies = [
    "mlx-qwen3-asr==0.4.4",
    "pypinyin==0.55.0",
    "opencc-python-reimplemented",
    "numpy",
    "soundfile",
    "opencv-python-headless",
    "fonttools",
    "jieba==0.42.1",
]

[dependency-groups]
dev = [
    "pytest",
]

[project.scripts]
pipeline = "pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[tool.pytest.ini_options]
markers = ["slow: runs the real ASR engine"]
addopts = "-m 'not slow'"
testpaths = ["tests"]
